 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINI4C Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a0f;
            --card-bg: #14141f;
            --accent: #ff003c;
            --blue: #00f0ff;
            --text: #ffffff;
            --border: rgba(255, 0, 60, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 30px; }

        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: var(--card-bg); border-bottom: 1px solid var(--border); }
        .logo { font-weight: bold; color: var(--accent); font-size: 18px; }
        .wallet-bar { display: flex; gap: 10px; align-items: center; font-weight: bold; color: var(--blue); }

        .container { max-width: 1000px; margin: 25px auto; padding: 0 15px; }

        .section { display: none; }
        .section.active { display: block; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
        .product-card { background: var(--card-bg); border: 1px solid var(--border); padding: 18px; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; }
        .product-card h3 { font-size: 14px; margin-bottom: 10px; color: #fff; }

        .btn-primary { background: var(--accent); color: #fff; border: none; padding: 8px 14px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-success { background: #00ff66; color: #000; border: none; width: 100%; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-close { background: #222; color: #aaa; border: none; width: 100%; padding: 8px; margin-top: 10px; border-radius: 5px; cursor: pointer; }
        .btn-small { padding: 5px 10px; font-size: 12px; }

        .input-field { width: 100%; padding: 10px; background: rgba(0,0,0,0.6); border: 1px solid var(--border); color: #fff; border-radius: 5px; outline: none; margin-top: 5px; margin-bottom: 10px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-card { background: var(--card-bg); border: 1px solid var(--accent); padding: 22px; width: 90%; max-width: 380px; border-radius: 10px; }
        .qr-box { margin-top: 15px; text-align: center; }
        .qr-box img { width: 160px; height: 160px; background: #fff; padding: 8px; border-radius: 6px; }
        .qr-text { color: var(--blue); font-weight: bold; margin-top: 8px; }
        .utr-box { text-align: left; margin-top: 12px; font-size: 12px; }

        .auth-card { background: var(--card-bg); border: 1px solid var(--accent); padding: 25px; max-width: 380px; margin: 40px auto; border-radius: 10px; }
        .auth-toggle { text-align: center; font-size: 13px; color: var(--blue); cursor: pointer; margin-top: 12px; text-decoration: underline; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo"><i class="fa-solid fa-store"></i> MINI4C STORE</div>
        <div class="wallet-bar">
            <span id="userBadge" style="color:#aaa; font-size:12px;">Guest</span>
            <span>₹<span id="userBalance">0.00</span></span>
            <button onclick="openFundModal()" class="btn-primary btn-small">+ Add Money</button>
            <button id="logoutBtn" onclick="logoutUser()" class="btn-primary btn-small" style="background:#444; display:none;">Logout</button>
        </div>
    </header>

    <main class="container">
        <!-- Auth Section (Login / Register) -->
        <section id="authSection" class="section active">
            <div class="auth-card" id="loginBox">
                <h3 style="color:var(--accent); margin-bottom:15px; text-align:center;">User / Admin Login</h3>
                <input type="text" id="loginUser" placeholder="Username" class="input-field">
                <input type="password" id="loginPass" placeholder="Password" class="input-field">
                <button onclick="loginUser()" class="btn-primary" style="width:100%; margin-top:5px;">LOGIN</button>
                <div class="auth-toggle" onclick="toggleAuth('register')">New User? Register Here</div>
            </div>

            <div class="auth-card" id="registerBox" style="display:none;">
                <h3 style="color:var(--accent); margin-bottom:15px; text-align:center;">Register Account</h3>
                <input type="text" id="regUser" placeholder="Choose Username" class="input-field">
                <input type="password" id="regPass" placeholder="Choose Password" class="input-field">
                <button onclick="registerUser()" class="btn-primary" style="width:100%; margin-top:5px; background:#00ff66; color:#000;">REGISTER</button>
                <div class="auth-toggle" onclick="toggleAuth('login')">Already have an account? Login</div>
            </div>
        </section>

        <!-- Main Store Catalog (After Login) -->
        <section id="dashboardSection" class="section">
            <h2 style="color:var(--accent); margin-bottom: 20px;">Store Catalog</h2>
            <div id="productGrid" class="grid"></div>
        </section>
    </main>

    <!-- Payment Modal -->
    <div id="fundModal" class="modal">
        <div class="modal-card">
            <h3>Add Funds via UPI</h3>
            <input type="number" id="fundAmount" placeholder="Enter Amount (INR)" class="input-field">
            <button onclick="generateQR()" class="btn-primary" style="margin-top:10px; width:100%;">Generate QR Code</button>

            <div id="qrContainer" class="qr-box" style="display:none;">
                <img id="qrImg" src="" alt="UPI QR">
                <p id="qrAmountText" class="qr-text"></p>
                
                <div class="utr-box">
                    <label>Enter 12-Digit UTR / Ref Number:</label>
                    <input type="text" id="utrInput" maxlength="12" placeholder="e.g. 423456789012" class="input-field">
                    <button onclick="submitUTR()" class="btn-success" style="margin-top:8px;">INSTANT ADD FUNDS</button>
                </div>
            </div>
            <button onclick="closeFundModal()" class="btn-close">Close</button>
        </div>
    </div>

    <script>
        const defaultProducts = [
            { id: 1, name: "DELTA PROXY IOS IPHONE", price: 150 },
            { id: 2, name: "MIGUL IPHONE IOS SERVICE", price: 250 },
            { id: 3, name: "XYZ UTILITY ROOT ANDROID", price: 70 },
            { id: 4, name: "PRIME HOOK NONROOT ANDROID", price: 50 },
            { id: 5, name: "BALA SYSTEM V2 NONROOT", price: 230 },
            { id: 6, name: "HG PRIME PROXY NONROOT", price: 70 },
            { id: 7, name: "DRIPCLIENT SERVICE MODULE", price: 60 },
            { id: 8, name: "HG ANDROID PROXY NONROOT", price: 70 },
            { id: 9, name: "HG DUAL MODE UTILITY", price: 70 },
            { id: 10, name: "HAXX PRO ROOT EDITION", price: 180 },
            { id: 11, name: "SILENT ACCESS ROOT ANDROID", price: 90 },
            { id: 12, name: "PATO TEAM SUITE ALL ANDROID", price: 150 },
            { id: 13, name: "BR VERSION PC EDITION", price: 79 },
            { id: 14, name: "INVISIBLE X STREAMER PANEL", price: 99 },
            { id: 15, name: "RAPID CORE OPTIMIZER", price: 89 },
            { id: 16, name: "SKB SPECIAL OFFER BUNDLE", price: 99 },
            { id: 17, name: "INVISIBLE X PRO PASS", price: 99 },
            { id: 18, name: "P20 ROOT SERVICE PACK", price: 600 },
            { id: 19, name: "P20 STANDARD NON ROOT PACK", price: 800 },
            { id: 20, name: "DEVICE CONFIGURATION SERVICE", price: 1000 },
            { id: 21, name: "NINE X INJECTOR SYSTEM", price: 400 }
        ];

        let currentUser = localStorage.getItem("activeUser") || null;

        document.addEventListener("DOMContentLoaded", () => {
            checkAuth();
            renderProducts();
        });

        function toggleAuth(type) {
            if(type === 'register') {
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("registerBox").style.display = "block";
            } else {
                document.getElementById("registerBox").style.display = "none";
                document.getElementById("loginBox").style.display = "block";
            }
        }

        function registerUser() {
            let u = document.getElementById("regUser").value.trim();
            let p = document.getElementById("regPass").value.trim();

            if(!u || !p) {
                alert("Fill all fields!");
                return;
            }

            let users = JSON.parse(localStorage.getItem("storeUsers") || "{}");
            if(users[u]) {
                alert("Username already exists!");
                return;
            }

            users[u] = { password: p, balance: 0.00 };
            localStorage.setItem("storeUsers", JSON.stringify(users));
            alert("Registration Successful! Please Login.");
            toggleAuth('login');
        }

        function loginUser() {
            let u = document.getElementById("loginUser").value.trim();
            let p = document.getElementById("loginPass").value.trim();

            if(u === "ADX ANKIT" && p === "MINI4C") {
                currentUser = "ADX ANKIT";
                localStorage.setItem("activeUser", currentUser);
                checkAuth();
                return;
            }

            let users = JSON.parse(localStorage.getItem("storeUsers") || "{}");
            if(users[u] && users[u].password === p) {
                currentUser = u;
                localStorage.setItem("activeUser", currentUser);
                checkAuth();
            } else {
                alert("Invalid Username or Password!");
            }
        }

        function logoutUser() {
            localStorage.removeItem("activeUser");
            currentUser = null;
            checkAuth();
        }

        function checkAuth() {
            if(currentUser) {
                document.getElementById("authSection").classList.remove("active");
                document.getElementById("dashboardSection").classList.add("active");
                document.getElementById("logoutBtn").style.display = "inline-block";
                document.getElementById("userBadge").innerText = currentUser;
                updateBalanceUI();
            } else {
                document.getElementById("authSection").classList.add("active");
                document.getElementById("dashboardSection").classList.remove("active");
                document.getElementById("logoutBtn").style.display = "none";
                document.getElementById("userBadge").innerText = "Guest";
                document.getElementById("userBalance").innerText = "0.00";
            }
        }

        function getBalance() {
            if(currentUser === "ADX ANKIT") {
                return parseFloat(localStorage.getItem("adminBalance") || "0.00");
            }
            let users = JSON.parse(localStorage.getItem("storeUsers") || "{}");
            return users[currentUser] ? users[currentUser].balance : 0.00;
        }

        function setBalance(amt) {
            if(currentUser === "ADX ANKIT") {
                localStorage.setItem("adminBalance", amt.toFixed(2));
            } else {
                let users = JSON.parse(localStorage.getItem("storeUsers") || "{}");
                if(users[currentUser]) {
                    users[currentUser].balance = amt;
                    localStorage.setItem("storeUsers", JSON.stringify(users));
                }
            }
            updateBalanceUI();
        }

        function updateBalanceUI() {
            if(currentUser) {
                document.getElementById("userBalance").innerText = getBalance().toFixed(2);
            }
        }

        function renderProducts() {
            const grid = document.getElementById("productGrid");
            grid.innerHTML = "";
            defaultProducts.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div>
                            <h3>${p.name}</h3>
                            <p style="color:var(--blue); font-weight:bold; margin-bottom:10px;">₹${p.price}.00</p>
                        </div>
                        <button class="btn-primary" onclick="buyProduct(${p.price}, '${p.name}')">Buy Item</button>
                    </div>
                `;
            });
        }

        function buyProduct(price, name) {
            let bal = getBalance();
            if(bal >= price) {
                setBalance(bal - price);
                alert(`Successfully purchased: ${name}`);
            } else {
                alert("Insufficient Balance! Please add funds first.");
                openFundModal();
            }
        }

        function generateQR() {
            let amt = parseFloat(document.getElementById("fundAmount").value);
            if(isNaN(amt) || amt < 10) {
                alert("Enter a valid amount (Min ₹10)");
                return;
            }
            let upiUrl = `upi://pay?pa=ankittt.3@fam&pn=MINI4C&am=${amt}&cu=INR`;
            document.getElementById("qrImg").src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(upiUrl)}`;
            document.getElementById("qrAmountText").innerText = `Paying: ₹${amt}.00`;
            document.getElementById("qrContainer").style.display = "block";
        }

        function submitUTR() {
            let amt = parseFloat(document.getElementById("fundAmount").value);
            let utr = document.getElementById("utrInput").value.trim();

            if (!utr || utr.length !== 12 || isNaN(utr)) {
                alert("Enter a valid 12-digit UTR/Reference number!");
                return;
            }

            let usedUTRs = JSON.parse(localStorage.getItem("usedUTRs") || "[]");
            
            if(usedUTRs.includes(utr)) {
                alert("This UTR has already been used!");
                return;
            }

            // Auto Approve Fund
            usedUTRs.push(utr);
            localStorage.setItem("usedUTRs", JSON.stringify(usedUTRs));

            let currentBal = getBalance();
            setBalance(currentBal + amt);

            alert(`Success! ₹${amt} added instantly to your wallet.`);
            closeFundModal();
        }

        function openFundModal() { 
            if(!currentUser) {
                alert("Please login first!");
                return;
            }
            document.getElementById("fundModal").style.display = "flex"; 
        }

        function closeFundModal() { 
            document.getElementById("fundModal").style.display = "none"; 
            document.getElementById("qrContainer").style.display = "none";
            document.getElementById("utrInput").value = "";
        }
    </script>
</body>
</html>
