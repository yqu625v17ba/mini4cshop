 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINI4C SHOP - Cyber Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050508;
            --card-bg: rgba(18, 18, 26, 0.75);
            --red-glow: #ff003c;
            --red-bright: #ff2a5f;
            --neon-blue: #00f0ff;
            --border-neon: rgba(255, 0, 60, 0.25);
            --text-main: #ffffff;
            --text-sub: #b0b5c0;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Rajdhani', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; }
        #bgCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }
        #loader-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: #050508; z-index: 99999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: opacity 0.5s ease;
        }
        .cyber-spinner {
            width: 60px; height: 60px; border: 3px solid rgba(255, 0, 60, 0.1);
            border-top: 3px solid var(--red-glow); border-right: 3px solid var(--neon-blue);
            border-radius: 50%; animation: spin 0.8s linear infinite;
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.4);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-title {
            margin-top: 20px; color: var(--red-glow); font-family: 'Orbitron', sans-serif;
            font-weight: 700; letter-spacing: 3px; font-size: 14px; text-shadow: 0 0 10px var(--red-glow);
        }
    </style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div id="loader-overlay">
    <div class="cyber-spinner"></div>
    <div class="loader-title"><i class="fa-solid fa-skull"></i> INITIALIZING MINI4C STORE...</div>
</div>
    <div id="authScreen">
        <div class="auth-card">
            <div class="auth-header">
                <button class="auth-tab active" id="tabLoginBtn" onclick="toggleAuthTab('login')">LOGIN</button>
                <button class="auth-tab" id="tabRegisterBtn" onclick="toggleAuthTab('register')">CREATE ACCOUNT</button>
            </div>
            <form id="loginForm" class="auth-form active" onsubmit="event.preventDefault(); handleAuthSubmit('login');">
                <div class="input-group">
                    <label><i class="fa-solid fa-user"></i> Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="loginUsername" placeholder="Enter Username" required>
                    </div>
                </div>
                <div class="input-group">
                    <label><i class="fa-solid fa-lock"></i> Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="loginPassword" placeholder="Enter Password" required>
                        <i class="fa-solid fa-eye password-toggle" onclick="togglePasswordVisibility('loginPassword', this)"></i>
                    </div>
                </div>
                <button type="submit" class="cyber-btn"><i class="fa-solid fa-right-to-bracket"></i> ACCESS STORE</button>
            </form>
            <form id="registerForm" class="auth-form" onsubmit="event.preventDefault(); handleAuthSubmit('register');">
                <div class="input-group">
                    <label><i class="fa-solid fa-user-plus"></i> Choose Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="regUsername" placeholder="Create Username" required>
                    </div>
                </div>
                <div class="input-group">
                    <label><i class="fa-solid fa-key"></i> Create Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="regPassword" placeholder="Create Password" required>
                        <i class="fa-solid fa-eye password-toggle" onclick="togglePasswordVisibility('regPassword', this)"></i>
                    </div>
                </div>
                <button type="submit" class="cyber-btn"><i class="fa-solid fa-user-check"></i> REGISTER ACCOUNT</button>
            </form>
        </div>
    </div>

    <header class="top-navbar">
        <div class="menu-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></div>
        <div class="logo"><i class="fa-solid fa-skull"></i> MINI4C X STORE</div>
        <div class="wallet-section">
            <span class="wallet-balance">₹<span id="userBalance">0.00</span></span>
            <button class="add-fund-btn" onclick="openAddFundModal()">+ FUND</button>
        </div>
    </header>
        <nav id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3><i class="fa-solid fa-gamepad"></i> DASHBOARD</h3>
            <i class="fa-solid fa-xmark" onclick="toggleSidebar()" style="cursor:pointer; font-size: 18px;"></i>
        </div>
        <ul class="sidebar-links">
            <li><a onclick="switchTab('buyKey')"><i class="fa-solid fa-key"></i> Marketplace Stock</a></li>
            <li><a onclick="switchTab('myKeys')"><i class="fa-solid fa-box-archive"></i> My Purchased Keys</a></li>
            <li><a onclick="openAddFundModal(); toggleSidebar();"><i class="fa-solid fa-wallet"></i> Add Wallet Money</a></li>
            <li><a onclick="switchTab('history')"><i class="fa-solid fa-clock-rotate-left"></i> Payment Log History</a></li>
            <li id="adminTabLink" style="display: none;"><a onclick="switchTab('adminPanel')" style="color: var(--neon-blue); font-weight: bold;"><i class="fa-solid fa-user-shield"></i> Admin Dashboard</a></li>
            <li><a href="https://t.me/+Ga2FZ1QnY8VjN2Y1" target="_blank"><i class="fa-brands fa-telegram"></i> Telegram Channel</a></li>
            <li><a href="https://discord.gg/Yttbf69xx" target="_blank"><i class="fa-brands fa-discord"></i> Discord Community</a></li>
            <li><a onclick="handleLogout()" style="color: var(--red-glow);"><i class="fa-solid fa-right-from-bracket"></i> Logout Session</a></li>
        </ul>
    </nav>

    <div class="container">
        <div id="buyKeySection" class="section active">
            <h2 class="section-title">MARKETPLACE / PRODUCTS</h2>
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="productSearchInput" class="search-input" placeholder="Search hacks, cheats or mods..." onkeyup="filterProducts()">
            </div>
            <div id="productContainer" class="product-grid"></div>
        </div>
    </div>

    <!-- Add Funds UPI Modal with UTR Input -->
    <div id="addFundModal" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--red-glow); font-family:'Orbitron', sans-serif; margin-bottom: 10px;">Add Wallet Money</h3>
            <input type="number" id="fundAmountInput" placeholder="Enter Amount (INR)" style="width: 100%; padding: 12px; background: rgba(0,0,0,0.7); border: 1px solid var(--border-neon); color: #fff; border-radius: 6px; margin-bottom: 12px; text-align: center; font-size: 16px; font-weight: bold; outline: none;">
            <button onclick="generateAddFundQR()" class="cyber-btn" style="margin-bottom: 15px;">GENERATE QR CODE</button>
            
            <div id="qrCodeContainer" style="display: none; background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 15px;">
                <img id="generatedQRImg" src="" alt="Dynamic UPI QR" style="width: 170px; height: 170px;">
                <p id="displayAmountText" style="color: #000; font-weight: bold; font-size: 15px; margin-top: 8px; font-family:'Orbitron', sans-serif;"></p>
                <p style="color: #333; font-size: 12px; font-weight: 600;">UPI VPA: <b>ankittt.3@fam</b></p>
            </div>

            <!-- UTR Verification Box -->
            <div id="utrVerificationContainer" style="margin-bottom: 15px; display: none;">
                <input type="text" id="utrInputId" placeholder="Enter 12-digit UTR / Ref Number" style="width: 100%; padding: 10px; background: rgba(0,0,0,0.7); border: 1px solid var(--border-neon); color: #fff; border-radius: 6px; margin-bottom: 10px; text-align: center; font-size: 14px; outline: none;">
                <button onclick="submitUtrForAutoCredit()" class="cyber-btn" style="background: var(--neon-blue); color: #000;">VERIFY UTR & ADD MONEY</button>
            </div>
            <button onclick="closeAddFundModal()" style="width: 100%; padding: 9px; background: #222; color: #fff; border: none; border-radius: 6px; cursor: pointer;">Close</button>
        </div>
    </div>
        <script>
        const defaultProducts = [
            { id: 1, name: "DELTA PROXY IOS IPHONE", features: ["Body Proxy - Full Red", "Neck Proxy V1", "Neck Proxy V2"], variants: [{ name: "1 Days", price: 150 }, { name: "7 Days", price: 350 }, { name: "30 Days", price: 700 }] },
            { id: 2, name: "MIGUL IPHONE IOS FF", features: ["Silent Aim", "AimBot", "Speed Hack"], variants: [{ name: "1 Day's Basic", price: 250 }, { name: "7 Day's Basic", price: 600 }, { name: "30 Day's Basic", price: 1200 }] },
            { id: 3, name: "XYZ CHEATS FF ROOT ANDROID", features: ["Silent Aim", "Aim Magnet", "Aimbot"], variants: [{ name: "1 Days", price: 70 }, { name: "2 Days", price: 150 }] },
            { id: 4, name: "PRIME HOOK FF NONROOT ANDROID", features: ["Aim Magnet", "Silent Aim", "Aimbot"], variants: [{ name: "1 Days Nonroot", price: 50 }, { name: "7 Days Nonroot", price: 270 }] },
            { id: 5, name: "BALA MOD XYZ - V2 FF NONROOT", features: ["NONROOT Direct", "Auto Headshot", "ESP Location"], variants: [{ name: "1 Days", price: 230 }, { name: "7 Days", price: 1300 }] },
            { id: 6, name: "HG CHEATS PRIME PROXY FF NONROOT", features: ["Aimsafe Main", "Aimbot", "Headshot"], variants: [{ name: "1 Days", price: 70 }, { name: "7 Days", price: 250 }] },
            { id: 7, name: "DRIPCLIENT FF NONROOT APKMOD", features: ["Aimkill", "Silent Aim", "Underkill"], variants: [{ name: "1 Day's Nonroot", price: 60 }, { name: "30 Day's Nonroot", price: 600 }] },
            { id: 8, name: "HG CHEATS ANDROID PROXY FF NONROOT", features: ["AIMBOT", "PRECISAO", "HS ALTO"], variants: [{ name: "1 Day's", price: 70 }, { name: "30 Day's", price: 500 }] },
            { id: 9, name: "HG CHEATS FF APKMOD NONROOT+ROOT", features: ["Aim Magnet", "Silent Aim", "Aimbot"], variants: [{ name: "1 Day's", price: 70 }, { name: "30 Day's", price: 500 }] },
            { id: 10, name: "HAXX-CKER PRO FF ROOT", features: ["Aimsafe Main Id Root", "Aimbot"], variants: [{ name: "3 Day's", price: 180 }, { name: "30 Day's", price: 1450 }] },
            { id: 11, name: "SILENT CHEAT FF ROOT ANDROID", features: ["Safe Main Id", "Silent Aim"], variants: [{ name: "1 Day's SAFE", price: 90 }, { name: "7 Day's SAFE", price: 350 }] },
            { id: 12, name: "PATO TEAM FF ALL ANDROID", features: ["Silent Aim", "Aim Magnet"], variants: [{ name: "3 Day's Mix", price: 150 }, { name: "30 Day's Mix", price: 700 }] },
            { id: 13, name: "BR MOD FF PC VERSION", features: ["Silent Aim", "Aim Magnet"], variants: [{ name: "1 Day Pc", price: 79 }, { name: "30 Day Pc", price: 799 }] },
            { id: 14, name: "INVISIBLE X (STREAMER PANEL)", features: ["Streamer Panel", "All Devices"], variants: [{ name: "1 Day", price: 99 }, { name: "31 Days", price: 999 }] },
            { id: 15, name: "RAPID CORE", features: ["Rapid Core Engine", "Bypass"], variants: [{ name: "1 Day", price: 89 }, { name: "30 Days", price: 799 }] },
            { id: 16, name: "SKB MOD (SPECIAL OFFER)", features: ["Special Offer", "High Headshot"], variants: [{ name: "1 Day", price: 99 }, { name: "30 Days", price: 799 }] },
            { id: 17, name: "INVISABLE X", features: ["High Performance", "Safe Aim"], variants: [{ name: "1 Day", price: 99 }, { name: "30 Days", price: 999 }] },
            { id: 18, name: "P20 ROOT DEVICE", features: ["Root Device Special"], variants: [{ name: "30 Days Plan", price: 600 }] },
            { id: 19, name: "P20 NON ROOT", features: ["Non-Root Supported"], variants: [{ name: "30 Days Plan", price: 800 }] },
            { id: 20, name: "PHONE TO PHONE ROOTING SERVICE", features: ["HyperOS & Other Brands"], variants: [{ name: "HyperOS Root", price: 1500 }, { name: "Other Brands", price: 1000 }] },
            { id: 21, name: "NINE X INJECTOR", features: ["High Precision Injector"], variants: [{ name: "10 Days", price: 400 }] }
        ];

        window.onload = function() {
            renderProducts(defaultProducts);
            updateBalanceUI();
        };

        function renderProducts(list) {
            let container = document.getElementById("productContainer");
            container.innerHTML = "";
            list.forEach(p => {
                let card = document.createElement("div");
                card.className = "product-card";
                card.innerHTML = `<h3 class="product-title">${p.name}</h3><button class="cyber-btn" onclick="alert('Select product plan')">BUY</button>`;
                container.appendChild(card);
            });
        }

        function generateAddFundQR() {
            let amt = document.getElementById("fundAmountInput").value;
            if(!amt || amt < 10) { alert("Enter valid amount"); return; }
            document.getElementById("generatedQRImg").src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent('upi://pay?pa=ankittt.3@fam&am='+amt)}` ;
            document.getElementById("displayAmountText").innerText = `Pay: ₹${amt}`;
            document.getElementById("qrCodeContainer").style.display = "block";
            document.getElementById("utrVerificationContainer").style.display = "block";
        }

        function submitUtrForAutoCredit() {
            let utr = document.getElementById("utrInputId").value.trim();
            let amt = parseFloat(document.getElementById("fundAmountInput").value);
            if(utr.length < 8) { alert("Invalid UTR"); return; }
            let bal = parseFloat(localStorage.getItem("walletBalance") || "0") + amt;
            localStorage.setItem("walletBalance", bal.toFixed(2));
            updateBalanceUI();
            alert(`Success! ₹${amt} added automatically.`);
            closeAddFundModal();
        }

        function updateBalanceUI() {
            document.getElementById("userBalance").innerText = parseFloat(localStorage.getItem("walletBalance") || "0").toFixed(2);
        }

        function openAddFundModal() { document.getElementById("addFundModal").style.display = "flex"; }
        function closeAddFundModal() { document.getElementById("addFundModal").style.display = "none"; }
        function toggleSidebar() { document.getElementById("sidebar").classList.toggle("active"); }
    </script>
</body>
</html>
